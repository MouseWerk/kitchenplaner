name: CI

on:
  push:
  pull_request:

# A newer push to the same branch stops the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    name: UI (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      - run: npm run --prefix ui typecheck
      - run: npm test --prefix ui
      - run: npm run --prefix ui build

  core:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # File handling differs per system (rename over an existing file, read-only flags, case).
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: System packages (WebKitGTK for the Tauri shell)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: cargo fmt --all --check
        if: runner.os == 'Linux'
      # tauri::generate_context! needs the frontend folder to exist; the UI job builds the real one.
      - name: Placeholder frontend
        shell: bash
        run: mkdir -p ui/dist && echo '<!doctype html><title>Kitchenplaner</title>' > ui/dist/index.html
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  bundle:
    name: Bundle (${{ matrix.name }})
    needs: [ui, core]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
            out: target/release/bundle/nsis/*.exe
          - name: Linux
            os: ubuntu-22.04
            args: ""
            out: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
          # One app for Apple Silicon and Intel; ad-hoc signed (signingIdentity "-").
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            out: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: System packages (WebKitGTK, AppImage tooling)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - run: npm ci
      - run: npm ci --prefix ui
      - run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: kitchenplaner-${{ matrix.name }}
          path: ${{ matrix.out }}
          if-no-files-found: error
