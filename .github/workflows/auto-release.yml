name: Auto release

# Starts the release (release.yml) by itself after CI passed for a push to main, when the app's
# version (Cargo.toml, scripts/version.mjs) has release notes docs/releases/v<version>.md, is newer
# than every release tag and its tag does not exist yet (scripts/release-pick.mjs). The commit CI
# tested must still be main's head; the tag is created on it. Without new notes for the app's
# version a green CI changes nothing.
#
# Switched off with the repository variable AUTO_RELEASE set to "false" (Settings -> Secrets and
# variables -> Actions -> Variables); docs/release/automatic.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One at a time and never cancelled: a second green run waits and then finds the first one's tag.
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  pick:
    name: Pick the version
    if: >-
      vars.AUTO_RELEASE != 'false' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pick
        shell: bash
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          HEAD="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "$HEAD" ] || [ "$HEAD" != "$SHA" ]; then
            echo "::notice::CI passed for $SHA, but main is at ${HEAD:-?} now: no release from this run."
            exit 0
          fi
          # Fails the step when the tags cannot be read; an empty list (no release yet) is fine.
          git ls-remote --tags --refs origin | sed 's#.*refs/tags/##' > "$RUNNER_TEMP/tags.txt"
          APP_VERSION="$(node scripts/version.mjs)"
          VERSION="$(node scripts/release-pick.mjs "$APP_VERSION" docs/releases "$RUNNER_TEMP/tags.txt" 2> "$RUNNER_TEMP/why.txt")"
          if [ -z "$VERSION" ]; then
            echo "::notice::No release: $(cat "$RUNNER_TEMP/why.txt")"
            exit 0
          fi
          echo "::notice::Releasing $VERSION from $SHA."
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: pick
    if: needs.pick.outputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    # The updater's signing key (release.yml): a called workflow sees no secrets otherwise.
    secrets: inherit
    with:
      version: ${{ needs.pick.outputs.version }}
      ref: ${{ needs.pick.outputs.sha }}
